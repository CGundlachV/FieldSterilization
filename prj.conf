CONFIG_PRINTK=y
CONFIG_WARN_EXPERIMENTAL=y

CONFIG_LOG=y
CONFIG_EXCEPTION_DEBUG=y

# Temperature treated as floating point number
CONFIG_REQUIRES_FLOAT_PRINTF=y

CONFIG_GPIO=y
CONFIG_I2C=y

CONFIG_MAIN_STACK_SIZE=4096

# Tick Source
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_KERNEL_MEM_POOL=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_COMMON_LIBC_MALLOC=n

# I2C Shell
CONFIG_I2C_SHELL=y
CONFIG_SHELL=y

# Application defaults. Temperatures are centi-degrees Celsius.
CONFIG_FIELDSTERILIZATION_SETPOINT_CENTIC=12100
CONFIG_FIELDSTERILIZATION_MAX_SAFE_CENTIC=13500
CONFIG_FIELDSTERILIZATION_VISUAL_MIN_CENTIC=2000
CONFIG_FIELDSTERILIZATION_VISUAL_MAX_CENTIC=18000
CONFIG_FIELDSTERILIZATION_CONTROL_WINDOW_MS=1000
CONFIG_FIELDSTERILIZATION_I2C_SCAN_ON_BOOT=y
